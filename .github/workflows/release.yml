name: Publish macOS prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/build.yml
  package:
    needs: verify
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: python3 scripts/package.py
      - name: Publish version from VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          gh release create "v$version" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt dist/release-manifest.json dist/INSTALL.txt --target "$GITHUB_SHA" --title "Study Glass $version — macOS Universal (공증 전 시험판)" --notes-file docs/release-notes.md --prerelease
