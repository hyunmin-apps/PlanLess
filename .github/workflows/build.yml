name: Build and verify macOS
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node tests/import-plan.cjs
      - run: node tests/bulk-delete.cjs
      - run: node tests/rollover.cjs
      - run: python3 tests/widget_model.py
      - run: ./build.sh --arch ${{ matrix.arch }}
      - run: python3 tests/verify.py 'build/${{ matrix.arch }}/PlanLess.app' ${{ matrix.arch }}
      - name: Launch app smoke test
        shell: bash
        run: |
          'build/${{ matrix.arch }}/PlanLess.app/Contents/MacOS/PlanLess' &
          app_pid=$!
          sleep 8
          kill -0 "$app_pid"
          kill "$app_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: PlanLess-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/PlanLess.app
