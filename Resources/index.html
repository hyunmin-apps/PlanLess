<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Study Glass</title>
<style>
:root{color-scheme:light dark;--ink:#263744;--muted:#697986;--line:#ffffff80;--card:#ffffff5c;--accent:#426d61;--soft:#ffffff36}*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:linear-gradient(125deg,#e6f3ec8a,#e8eafa70 53%,#f6e8df78);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:hover{filter:brightness(.94)}.shell{padding:22px 28px 20px;max-width:1500px;margin:auto}header,.row,.nav,.tools{display:flex;align-items:center;gap:10px}header{justify-content:space-between}.brand{font-size:19px;font-weight:720;letter-spacing:-.7px}.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#416c60;color:white;margin-right:9px;box-shadow:0 3px 10px #36554620}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:650}.pill,.icon{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}.icon{min-width:32px}.active{background:var(--accent)!important;color:#fff!important}.tools{gap:6px}.tools button{font-size:11px}h1{font-size:30px;letter-spacing:-1.3px;margin:7px 0 5px;font-weight:730}.sub{color:var(--muted);line-height:1.7;font-size:12px}.intro{display:flex;align-items:end;justify-content:space-between;margin:28px 0 21px}.nav{margin-bottom:16px}.range{font-weight:650;min-width:138px;text-align:center}.spacer{flex:1}.switch{display:flex;background:#637b7310;border:1px solid var(--line);padding:3px;border-radius:11px}.switch button{padding:6px 13px;border-radius:8px;font-size:12px}.switch .selected{background:var(--card);box-shadow:0 2px 6px #344b4210}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:17px;background:var(--soft);padding:12px 10px;min-height:104px;text-align:left;position:relative;transition:background .2s,transform .2s}.day.chosen{background:#ffffffa8;box-shadow:0 6px 20px #52695d0d;border-color:#71978b7a}.day .date{font-size:23px;font-weight:650;display:block;margin:7px 0}.day .dow{font-size:11px;color:var(--muted)}.day .count{font-size:10px;color:var(--muted)}.dot{height:4px;border-radius:5px;background:#81988e28;overflow:hidden;margin-top:10px}.dot i{display:block;height:100%;background:#628b7b}.weeklist{margin-top:13px;display:grid;gap:9px}.mini{font-size:10px;line-height:1.55;border-top:1px solid #71867c20;padding-top:8px}.mini strong{display:block;color:var(--c);font-size:10px}.mini.done{text-decoration:line-through;opacity:.55}.content{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:18px;margin-top:23px}.main,.aside{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.sectiontitle{font-size:17px;font-weight:700;letter-spacing:-.4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.badge{font-size:10px;border-radius:20px;padding:5px 9px;background:#66857515;color:var(--accent)}.tasks{margin-top:13px}.task{padding:15px 0;border-top:1px solid #75877d22;display:flex;align-items:flex-start;gap:12px}.check{flex-shrink:0;width:23px;height:23px;border:1.5px solid #8c9e9560;border-radius:8px;font-weight:700;line-height:20px;padding:0;margin-top:3px}.check.s1{background:#e7ba6330;color:#9d7123;border-color:#ba913763}.check.s2{background:#628a79;color:#fff;border-color:transparent}.subject{font-size:10px;font-weight:650;color:var(--c);margin-bottom:5px}.tasktitle{font-size:14px;font-weight:600;line-height:1.5;letter-spacing:-.2px}.detail{font-size:11px;color:var(--muted);line-height:1.7;margin-top:6px}.task.passed .tasktitle{text-decoration:line-through;color:var(--muted)}.taskbody{flex:1;min-width:0}.status{font-size:9px;color:var(--muted);padding-top:6px;white-space:nowrap}.aside h3{font-size:12px;margin:0 0 12px}.aside p{font-size:11px;line-height:1.9;color:var(--muted);margin:8px 0}.rule{padding:10px 0;border-bottom:1px solid #71867c20}.rule b{font-size:11px}.note{margin-top:20px}textarea{display:block;margin-top:8px;width:100%;min-height:105px;background:#ffffff2b;border:1px solid var(--line);border-radius:10px;color:var(--ink);resize:vertical;padding:10px;font-size:11px;line-height:1.7}.footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px;margin-top:17px;line-height:1.7}.add{display:flex;gap:8px;margin-top:8px}.add input{min-width:0;width:100%;background:#ffffff30;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--ink);font-size:11px}.empty{padding:24px 0;color:var(--muted);line-height:1.8}.delete{font-size:12px;color:var(--muted);padding:3px}.todaymark{position:absolute;right:10px;top:12px;height:5px;width:5px;border-radius:50%;background:var(--accent)}#error{color:#a63737;font-size:12px}.compact .weeklist{display:none}.compact .aside{display:none}.compact .content{grid-template-columns:1fr}.compact .intro{margin:19px 0}.compact .shell{padding:15px}.compact h1{font-size:23px}.compact .brand{font-size:16px}.compact .tools button{padding:6px}.compact .day{padding:9px 4px;text-align:center;min-height:86px;border-radius:12px}.compact .day .date{font-size:18px}.compact .week{gap:4px}.compact .count{font-size:9px}.compact .switch{display:none}.compact .main{padding:16px}.compact .content{margin-top:16px}.compact .intro .sub{display:none}.compact .eyebrow{font-size:9px}.compact .footer span:last-child{display:none}.compact .desktopLabel{display:none}
@media(prefers-color-scheme:dark){:root{--ink:#e0eae4;--muted:#a7b6b0;--line:#d3efe31e;--card:#283d3f82;--accent:#8bbba7;--soft:#273b3c55}body{background:linear-gradient(125deg,#243d3b85,#2c304975,#3e393775)}.day.chosen{background:#42605b90;border-color:#96c0ab80}.active{color:#17372c!important}.subject,.mini strong{filter:brightness(1.5) saturate(.75)}textarea,.add input{background:#16282330}}

header{margin-bottom:20px}.brand,.compact .brand{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}.content{grid-template-columns:1fr;margin-top:16px}.subject{font-size:11px}.tasktitle{font-size:16px}.task{padding:17px 0}.taskdetail{margin-top:7px}.taskdetail summary{font-size:10px;color:var(--muted);cursor:pointer;list-style:none}.taskdetail summary::before{content:'› ';}.taskdetail[open] summary::before{content:'⌄ ';}.main{padding:20px}.add{margin-top:2px}.add input{border-color:transparent;background:transparent}.add .pill{background:transparent;border-color:transparent}.tasks{margin-top:12px}

:root{color-scheme:dark;--ink:#ededed;--muted:#a0a0a5;--line:#ffffff12;--card:#202022;--accent:#d9d9dc;--soft:#202022}body{background:#171719}.day.chosen{background:#303033;border-color:#76767c;box-shadow:none}.subject,.mini strong{color:var(--c,#bcbcc6);filter:none;font-weight:700}.subject{font-size:14px;margin-bottom:7px}.mini strong{font-size:12px;margin-bottom:5px}.tasktitle{font-size:15px;font-weight:500;color:#c9c9ce}.switch{background:#202022}.switch .selected{background:#38383c}.active{background:#d9d9dc!important;color:#202022!important}.badge{background:#ffffff08;color:#babac0}.dot{background:#ffffff0d}.dot i{background:#b8b8be}.task,.mini{border-color:#ffffff10}.check{border-color:#66666e}.check.s1{background:#424247;color:#e8e8ec;border-color:#7c7c85}.check.s2{background:#d3d3da;color:#222226}.todaymark{background:#d9d9dc}.add input{background:#252528;border:1px solid #ffffff12}.add #newsubject{width:100px;flex:0 0 100px}.compact .add #newsubject{width:76px;flex-basis:76px}

.taskactions{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}.edit{font-size:11px;color:var(--muted);padding:5px 0 5px 8px}.edit:hover{color:var(--ink)}
dialog{width:min(420px,calc(100vw - 32px));background:#222226;color:var(--ink);border:1px solid #ffffff20;border-radius:18px;padding:24px;box-shadow:0 20px 70px #0008}dialog::backdrop{background:#0008}dialog h2{font-size:17px;margin:0 0 22px}dialog label{display:block;font-size:12px;color:var(--muted);margin:16px 0 7px}dialog input,dialog textarea{width:100%;padding:11px;background:#18181c;border:1px solid #ffffff20;border-radius:8px;color:var(--ink)}dialog textarea{min-height:85px;font-size:13px}.dialogactions{display:flex;gap:10px;align-items:center;margin-top:24px}.danger{color:#f2a3a3}.primary{background:#dddde4;color:#18181c;font-weight:600}.dialogerror{font-size:12px;color:#f2a3a3;margin-top:10px}.deletepreview{overflow-wrap:anywhere;line-height:1.6;color:var(--muted)}

#importDialog{width:min(650px,calc(100vw - 32px));max-height:85vh;overflow:auto}#importDialog h2{margin-bottom:12px}.importhelp{font-size:12px;color:var(--muted);line-height:1.7}.importpreview{max-height:240px;overflow:auto;margin-top:16px}.importday{font-size:12px;margin:18px 0 6px}.importitem{padding:9px 0;border-top:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.importitem strong{font-size:11px;display:block;margin-bottom:4px}#aiPrompt{min-height:150px}#importText{min-height:160px}button:disabled{opacity:.4;cursor:default}.importitem .detail{white-space:pre-wrap}header{flex-wrap:wrap}
.danger.icon{color:#ef8585;font-size:19px;line-height:1;padding:6px 9px}.nav{flex-wrap:wrap}
</style>
<div class="shell"><header><div class="brand">공부 계획</div><div class="tools"><button id="aiPlan" class="pill">AI 계획</button><button id="desktop" class="pill" title="일반 창 뒤, 바탕화면에 두기">⌂ <span class="desktopLabel">바탕화면</span></button><button id="pin" class="pill" title="다른 창 위에 고정">고정</button><button id="compact" class="pill" title="작은 위젯 창 전환">작게</button></div></header>
<div class="nav"><button id="prev" class="icon" aria-label="이전 주">‹</button><span id="range" class="range"></span><button id="next" class="icon" aria-label="다음 주">›</button><button id="deleteWeek" class="icon danger" aria-label="이번 주 전체 삭제" title="이번 주 전체 삭제">×</button><button id="today" class="pill">오늘</button><span class="spacer"></span><div class="switch"><button id="dayview">하루</button><button id="weekview">한 주 펼치기</button></div></div>
<div id="week" class="week"></div><div class="content"><section class="main"><div class="sectionhead"><div id="daytitle" class="sectiontitle"></div><div class="row"><span id="progress" class="badge"></span><button id="deleteDay" class="icon danger" aria-label="선택한 날 전체 삭제" title="선택한 날 전체 삭제">×</button></div></div><div id="tasks" class="tasks"></div><form id="addform" class="add"><input id="newsubject" aria-label="과목명" placeholder="과목명" maxlength="30"><input id="newtask" aria-label="할 일 추가" placeholder="목표 추가" maxlength="180"><button class="pill" aria-label="추가">＋</button></form></section></div><div id="error" role="alert"></div></div>
<dialog id="editor" aria-labelledby="editheading"><form id="editform">
<h2 id="editheading">할 일 수정</h2>
<label for="editSubject">과목명</label><input id="editSubject" maxlength="30" required>
<label for="editTitle">할 일</label><input id="editTitle" maxlength="180" required>
<label for="editDetail">세부 내용</label><textarea id="editDetail" maxlength="3000"></textarea>
<div id="editError" class="dialogerror" role="alert"></div>
<div class="dialogactions"><button type="button" id="removeTask" class="danger">삭제</button><span class="spacer"></span><button type="button" id="cancelEdit" class="pill">취소</button><button type="submit" class="pill primary">저장</button></div>
</form></dialog>
<dialog id="deleteDialog" aria-labelledby="deleteheading"><h2 id="deleteheading">이 할 일을 삭제할까요?</h2><p id="deletePreview" class="deletepreview"></p><div class="dialogactions"><span class="spacer"></span><button id="cancelDelete" class="pill">취소</button><button id="confirmDelete" class="pill danger">삭제</button></div></dialog>
<dialog id="importDialog" aria-labelledby="importHeading">
<h2 id="importHeading">AI 계획 가져오기</h2>
<p class="importhelp">GPT·Claude에 원하는 계획을 요청할 때 아래 양식을 함께 전달하세요.</p>
<details><summary>1. 입력 양식</summary><textarea id="aiPrompt" aria-label="입력 양식" readonly></textarea><button id="copyPrompt" class="pill">양식 복사</button><span id="copyStatus" class="importhelp" role="status"></span></details>
<label for="importText">2. AI 결과 붙여넣기</label><textarea id="importText" placeholder='{"version":1,"tasks":[...]}' spellcheck="false"></textarea>
<p class="importhelp">기존 계획에 추가합니다. 날짜·과목·내용이 같은 항목은 건너뜁니다.</p>
<div id="importError" class="dialogerror" role="alert"></div><div id="importSummary" class="importhelp" role="status"></div><div id="importPreview" class="importpreview"></div>
<div class="dialogactions"><button id="cancelImport" class="pill">닫기</button><span class="spacer"></span><button id="previewImport" class="pill">미리보기</button><button id="confirmImport" class="pill primary" disabled>등록</button></div>
</dialog>
<dialog id="bulkDeleteDialog" aria-labelledby="bulkDeleteHeading"><h2 id="bulkDeleteHeading">계획 삭제</h2><p id="bulkDeletePreview" class="deletepreview"></p><div class="dialogactions"><span class="spacer"></span><button id="cancelBulkDelete" class="pill">취소</button><button id="confirmBulkDelete" class="pill danger">전체 삭제</button></div></dialog>
<script src="import-plan.js"></script>
<script>
const PLAN=[];
const colors={'동역학':'#8ec9b0','전자회로':'#e4c185','확률과통계':'#95bdf0','확통':'#95bdf0','자료구조':'#c6a7eb','자구알':'#c6a7eb','차량소프트웨어':'#e9a99b','차소웨':'#e9a99b','할일':'#bcbcc6'};
function subjectColor(name){const n=name.normalize('NFC').trim().replace(/\s+/g,'').toLowerCase();if(colors[n])return colors[n];let hash=0;for(const c of n)hash=(Math.imul(hash,31)+c.codePointAt(0))>>>0;return `hsl(${hash%360} 52% 74%)`;}

function initialState(){if(window.savedState)return window.savedState;try{return JSON.parse(localStorage.getItem('studyglass-preview'))||{}}catch{return {}}}
let state=initialState();state.edits ||= {};state.deleted ||= {};state.status ||= {};state.notes ||= {};state.extra ||= {};let selected=state.selected||(()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`})(),expanded=state.expanded??true,compact=window.nativePrefs?.compact||false,pinned=window.nativePrefs?.pin||false,desktop=window.nativePrefs?.desktop||false;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>new Date(s+'T12:00:00'),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,shift=(s,n)=>{let d=dt(s);d.setDate(d.getDate()+n);return key(d)},mon=s=>shift(s,-((dt(s).getDay()+6)%7));let start=mon(selected);
function native(action,data={}){window.webkit?.messageHandlers.native.postMessage({action,...data})}function save(){state.selected=selected;state.expanded=expanded;native('save',{state});if(!window.webkit)localStorage.setItem('studyglass-preview',JSON.stringify(state))}function showError(s){$('error').textContent=s}
function tasks(date){let p=PLAN.find(p=>p[0]===date);return [...(p?p[2].map((t,i)=>({id:date+'-'+i,subject:t[0],title:t[1],detail:t[2]})):[]),...(state.extra[date]||[])].filter(t=>!state.deleted[t.id]).map(t=>({...t,...state.edits[t.id]}))}
function render(){let end=shift(start,6);$('range').textContent=`${dt(start).getMonth()+1}.${dt(start).getDate()} – ${dt(end).getMonth()+1}.${dt(end).getDate()}`;$('dayview').className=!expanded?'selected':'';$('weekview').className=expanded?'selected':'';
$('week').innerHTML=Array.from({length:7},(_,i)=>{let date=shift(start,i),ts=tasks(date),done=ts.filter(t=>state.status[t.id]===2).length;return `<button class="day ${date===selected?'chosen':''}" data-date="${date}" aria-label="${date} ${ts.length}개 할 일" aria-pressed="${date===selected}"><span class="dow">${['월','화','수','목','금','토','일'][i]}</span>${date===key(new Date())?'<i class="todaymark"></i>':''}<span class="date">${dt(date).getDate()}</span><span class="count">${ts.length?done+' / '+ts.length+' 통과':'계획 없음'}</span><div class="dot"><i style="width:${ts.length?100*done/ts.length:0}%"></i></div>${expanded?`<div class="weeklist">${ts.map(t=>`<div class="mini ${state.status[t.id]===2?'done':''}" style="--c:${subjectColor(t.subject)}"><strong>${esc(t.subject)}</strong>${esc(t.title)}</div>`).join('')}</div>`:''}</button>`}).join('');
let ts=tasks(selected),done=ts.filter(t=>state.status[t.id]===2).length;$('daytitle').textContent=`${dt(selected).getMonth()+1}월 ${dt(selected).getDate()}일 ${['일','월','화','수','목','금','토'][dt(selected).getDay()]}요일`;$('progress').textContent=`${done} / ${ts.length} 통과`;
$('tasks').innerHTML=ts.length?ts.map(t=>{let s=state.status[t.id]||0;return `<div class="task ${s===2?'passed':''}" style="--c:${subjectColor(t.subject)}"><button class="check s${s}" data-check="${t.id}" aria-label="${esc(t.title)}: ${['미시작','학습','통과'][s]}, 다음 상태로 변경">${['','◐','✓'][s]}</button><div class="taskbody"><div class="subject">${esc(t.subject)}</div><div class="tasktitle">${esc(t.title)}</div>${t.detail?`<details class="taskdetail"><summary>세부 내용</summary><div class="detail">${esc(t.detail)}</div></details>`:''}</div><div class="taskactions"><span class="status">${['미시작','학습','통과'][s]}</span><button class="edit" data-edit="${esc(t.id)}" aria-label="${esc(t.title)} 수정">수정</button></div></div>`}).join(''):'<div class="empty">등록된 목표 없음</div>';}
$('week').onclick=e=>{let b=e.target.closest('[data-date]');if(b){selected=b.dataset.date;expanded=false;save();render()}};$('tasks').onclick=e=>{let b=e.target.closest('[data-check]');if(b){let id=b.dataset.check;state.status[id]=((state.status[id]||0)+1)%3;save();render()}let edit=e.target.closest('[data-edit]');if(edit)openEditor(edit.dataset.edit)};
let editingId=null;
function openEditor(id){const task=tasks(selected).find(t=>t.id===id);if(!task)return;editingId=id;$('editSubject').value=task.subject;$('editTitle').value=task.title;$('editDetail').value=task.detail||'';$('editError').textContent='';$('editor').showModal();$('editSubject').focus()}
$('cancelEdit').onclick=()=>$('editor').close();
$('editform').onsubmit=e=>{e.preventDefault();const subject=$('editSubject').value.trim(),title=$('editTitle').value.trim();if(!subject||!title){$('editError').textContent='과목명과 할 일을 입력해 주세요.';return}state.edits[editingId]={subject,title,detail:$('editDetail').value.trim()};save();$('editor').close();render()};
$('removeTask').onclick=()=>{const task=tasks(selected).find(t=>t.id===editingId);if(!task)return;$('deletePreview').textContent=task.subject+' · '+task.title;$('deleteDialog').showModal()};
$('cancelDelete').onclick=()=>$('deleteDialog').close();
$('confirmDelete').onclick=()=>{state.deleted[editingId]=true;delete state.status[editingId];save();$('deleteDialog').close();$('editor').close();render()};

$('prev').onclick=()=>{start=shift(start,-7);selected=shift(selected,-7);save();render()};$('next').onclick=()=>{start=shift(start,7);selected=shift(selected,7);save();render()};$('today').onclick=()=>{selected=key(new Date());start=mon(selected);save();render()};$('dayview').onclick=()=>{expanded=false;save();render()};$('weekview').onclick=()=>{expanded=true;save();render()};$('addform').onsubmit=e=>{e.preventDefault();let title=$('newtask').value.trim();if(!title)return;(state.extra[selected]||=[]).push({id:'custom-'+crypto.randomUUID(),subject:$('newsubject').value.trim()||'할 일',title,detail:'',custom:true});$('newtask').value='';save();render()};
function deleteTasksForDates(targetState,dates,getTasks){
 let count=0;
 for(const date of dates){for(const task of getTasks(date)){targetState.deleted[task.id]=true;delete targetState.status[task.id];count++}}
 return count;
}
let pendingBulkDates=[];
function openBulkDelete(week){
 pendingBulkDates=week?Array.from({length:7},(_,i)=>shift(start,i)):[selected];
 const count=pendingBulkDates.reduce((sum,date)=>sum+tasks(date).length,0);
 $('bulkDeleteHeading').textContent=week?'이번 주 계획 전체 삭제':'이날 계획 전체 삭제';
 const range=week?`${start} ~ ${shift(start,6)}`:selected;
 $('bulkDeletePreview').textContent=count?`${range}의 할 일 ${count}개를 모두 삭제할까요?`:`${range}에 삭제할 할 일이 없어요.`;
 $('confirmBulkDelete').disabled=!count;$('bulkDeleteDialog').showModal();
}
$('deleteWeek').onclick=()=>openBulkDelete(true);
$('deleteDay').onclick=()=>openBulkDelete(false);
$('cancelBulkDelete').onclick=()=>$('bulkDeleteDialog').close();
$('confirmBulkDelete').onclick=()=>{deleteTasksForDates(state,pendingBulkDates,tasks);save();render();$('bulkDeleteDialog').close()};

let importReady=null;
$('aiPlan').onclick=()=>{
 $('aiPrompt').value=`Study Glass 입력 양식
JSON만 출력. version은 1, tasks는 날짜별 할 일 배열.
date: YYYY-MM-DD (2000~2100년)
subject: 과목명 또는 분류 (필수, 30자 이하, 같은 과목은 같은 이름)
title: 할 일 (필수, 180자 이하)
detail: 세부 내용 (선택, 3000자 이하)
한 번에 최대 500개. 하루에 여러 할 일은 각각 별도 항목으로 작성.

{"version":1,"tasks":[{"date":"${selected}","subject":"과목명","title":"할 일","detail":"세부 내용"}]}`;
 $('copyStatus').textContent='';$('importDialog').showModal();
};
$('copyPrompt').onclick=async()=>{
 if(window.webkit?.messageHandlers.native){native('copyText',{text:$('aiPrompt').value});$('copyStatus').textContent=' 복사됨';return}
 try{await navigator.clipboard.writeText($('aiPrompt').value);$('copyStatus').textContent=' 복사됨'}catch{$('aiPrompt').select();$('copyStatus').textContent=' ⌘C로 복사하세요'}
};
function clearImportPreview(){importReady=null;$('confirmImport').disabled=true;$('importPreview').replaceChildren();$('importSummary').textContent='';$('importError').textContent=''}
$('importText').oninput=clearImportPreview;
$('cancelImport').onclick=()=>$('importDialog').close();
$('previewImport').onclick=()=>{
 clearImportPreview();
 try{
 importReady=PlanImport.prepare(PlanImport.parse($('importText').value),tasks);
 const rows=importReady.tasks,dates=[...new Set(rows.map(t=>t.date))];
 $('importSummary').textContent=`${dates.length}일 · ${rows.length}개 추가`+(importReady.skipped?` · 중복 ${importReady.skipped}개 제외`:'');
 $('importPreview').innerHTML=dates.map(d=>`<h3 class="importday">${esc(d)}</h3>`+rows.filter(t=>t.date===d).map(t=>`<div class="importitem"><strong style="color:${subjectColor(t.subject)}">${esc(t.subject)}</strong>${esc(t.title)}${t.detail?`<div class="detail">${esc(t.detail)}</div>`:''}</div>`).join('')).join('');
 $('confirmImport').disabled=!rows.length;
 }catch(e){$('importError').textContent=e.message}
};
$('confirmImport').onclick=()=>{
 if(!importReady)return;
 const rows=PlanImport.prepare(importReady.tasks,tasks).tasks;if(!rows.length){clearImportPreview();return}
 for(const t of rows){const {date,...task}=t;(state.extra[date]||=[]).push({...task,id:'custom-'+crypto.randomUUID(),custom:true})}
 selected=rows[0].date;start=mon(selected);expanded=true;save();render();
 $('importText').value='';clearImportPreview();$('importDialog').close();
};

$('compact').onclick=()=>{compact=!compact;$('compact').textContent=compact?'펼치기':'작게';native('compact',{value:compact})};$('pin').onclick=()=>{pinned=!pinned;desktop=false;$('pin').classList.toggle('active',pinned);$('desktop').classList.remove('active');native('desktop',{value:false});native('pin',{value:pinned})};$('desktop').onclick=()=>{desktop=!desktop;pinned=false;$('desktop').classList.toggle('active',desktop);$('pin').classList.remove('active');native('desktop',{value:desktop})};$('compact').textContent=compact?'펼치기':'작게';$('desktop').classList.toggle('active',desktop);$('pin').classList.toggle('active',pinned);new ResizeObserver(()=>document.body.classList.toggle('compact',innerWidth<720)).observe(document.body);render();
</script></html>
