:root{color-scheme:light dark;--ink:#263744;--muted:#697986;--line:#ffffff80;--card:#ffffff5c;--accent:#426d61;--soft:#ffffff36}*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:linear-gradient(125deg,#e6f3ec8a,#e8eafa70 53%,#f6e8df78);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:hover{filter:brightness(.94)}.shell{padding:22px 28px 20px;max-width:1500px;margin:auto}header,.row,.nav,.tools{display:flex;align-items:center;gap:10px}header{justify-content:space-between}.brand{font-size:19px;font-weight:720;letter-spacing:-.7px}.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#416c60;color:white;margin-right:9px;box-shadow:0 3px 10px #36554620}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:650}.pill,.icon{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}.icon{min-width:32px}.active{background:var(--accent)!important;color:#fff!important}.tools{gap:6px}.tools button{font-size:11px}h1{font-size:30px;letter-spacing:-1.3px;margin:7px 0 5px;font-weight:730}.sub{color:var(--muted);line-height:1.7;font-size:12px}.intro{display:flex;align-items:end;justify-content:space-between;margin:28px 0 21px}.nav{margin-bottom:16px}.range{font-weight:650;min-width:138px;text-align:center}.spacer{flex:1}.switch{display:flex;background:#637b7310;border:1px solid var(--line);padding:3px;border-radius:11px}.switch button{padding:6px 13px;border-radius:8px;font-size:12px}.switch .selected{background:var(--card);box-shadow:0 2px 6px #344b4210}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:17px;background:var(--soft);padding:12px 10px;min-height:104px;text-align:left;position:relative;transition:background .2s,transform .2s}.day.chosen{background:#ffffffa8;box-shadow:0 6px 20px #52695d0d;border-color:#71978b7a}.day .date{font-size:23px;font-weight:650;display:block;margin:7px 0}.day .dow{font-size:11px;color:var(--muted)}.day .count{font-size:10px;color:var(--muted)}.dot{height:4px;border-radius:5px;background:#81988e28;overflow:hidden;margin-top:10px}.dot i{display:block;height:100%;background:#628b7b}.weeklist{margin-top:13px;display:grid;gap:9px}.mini{font-size:10px;line-height:1.55;border-top:1px solid #71867c20;padding-top:8px}.mini strong{display:block;color:var(--c);font-size:10px}.mini.done{text-decoration:line-through;opacity:.55}.content{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:18px;margin-top:23px}.main,.aside{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.sectiontitle{font-size:17px;font-weight:700;letter-spacing:-.4px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.badge{font-size:10px;border-radius:20px;padding:5px 9px;background:#66857515;color:var(--accent)}.tasks{margin-top:13px}.task{padding:15px 0;border-top:1px solid #75877d22;display:flex;align-items:flex-start;gap:12px}.check{flex-shrink:0;width:23px;height:23px;border:1.5px solid #8c9e9560;border-radius:8px;font-weight:700;line-height:20px;padding:0;margin-top:3px}.check.s1{background:#e7ba6330;color:#9d7123;border-color:#ba913763}.check.s2{background:#628a79;color:#fff;border-color:transparent}.subject{font-size:10px;font-weight:650;color:var(--c);margin-bottom:5px}.tasktitle{font-size:14px;font-weight:600;line-height:1.5;letter-spacing:-.2px}.detail{font-size:11px;color:var(--muted);line-height:1.7;margin-top:6px}.task.passed .tasktitle{text-decoration:line-through;color:var(--muted)}.taskbody{flex:1;min-width:0}.status{font-size:9px;color:var(--muted);padding-top:6px;white-space:no <div class="shell"><header><div class="brand">공부 계획</div><div class="tools"><button id="desktop" class="pill" title="일반 창 뒤, 바탕화면에 두기">⌂ <span class="desktopLabel">바탕화면</span></button><button id="pin" class="pill" title="다른 창 위에 고정">고정</button><button id="compact" class="pill" title="작은 위젯 창 전환">작게</button></div></header>
<div class="nav"><button id="prev" class="icon" aria-label="이전 주">‹</button><span id="range" class="range"></span><button id="next" class="icon" aria-label="다음 주">›</button><button id="today" class="pill">오늘</button><span class="spacer"></span><div class="switch"><button id="dayview">하루</button><button id="weekview">한 주 펼치기</button></div></div>
<div id="week" class="week"></div><div class="content"><section class="main"><div class="sectionhead"><div id="daytitle" class="sectiontitle"></div><span id="progress" class="badge"></span></div><div id="tasks" class="tasks"></div><form id="addform" class="add"><input id="newsubject" aria-label="과목명" placeholder="과목명" maxlength="30"><input id="newtask" aria-label="할 일 추가" placeholder="목표 추가" maxlength="180"><button class="pill" aria-label="추가">＋</button></form></section></div><div id="error" role="alert"></div></div>
<script>
const PLAN=[
["2026-10-12","계산 과목 복습 시작",[["동역학","10문제 · 복습 6 + 새 문제 4","3/148 포함. 복습도 식부터 답까지 직접 풀기."],["전자회로","CH1 6문제 · 예제 3 + 연습 3","다이오드 동작 판단·계산 유형을 골고루 선택."],["확률과 통계","CH1·2 6문제 · 각 3개","예제·과제에서 선택. 해설 없이, 풀이가 바로 떠오르지 않는 문제 우선."],["자료구조","객관식 20문제","리스트·스택·큐 중심. 오답은 틀린 보기의 이유까지 적기."]]],
["2026-10-13","남은 범위와 CH3 처리",[["차량소프트웨어","범위 대조 + 답안 초안","확정 범위와 현재 정리 대조. 08·남은 T가 범위라면 포함. 족보 질문별 답안 초안. 새벽에 한 08은 이 분량의 선행으로 계산."],["자료구조","객관식 20 + 주관식 5","코드 빈칸·실행 결과형 주관식 만들어 풀기."],["확률과 통계","CH3 6문제","3.2-24 재풀이 + 서로 다른 유형 5개. 막힌 문제는 해설 확인 후 덮고 재풀이."],["전자회로","CH2 6문제 · 바이어스별 2개","고정·전압분배·자기 바이어스. 2.24·2.25 포함. 3장은 확인된 시험범위 밖."]]],
["2026-10-14","첫 오답 회수",[["동역학","최소 10문제 복습","월요일 오답 우선. 10개를 제대로 마치고 여유가 있을 때만 최대 15개."],["확률과 통계","CH2 연습문제 6개","조건부 확률·분포 등 서로 다른 유형 선택."],["전자회로","레포트 8문제 · CH1·2 각 4개","맞힌 기억만 나는 문제도 계산 과정을 다시 작성."],["차량소프트웨어","정리 마무리 + 질문 10개","전날 남긴 정리 마무리. 자료 없이 핵심 질문 답하기."]]],
["2026-10-15","도움 없는 두 번째 풀이",[["확률과 통계","CH1·2 8문제 · 각 4개","무해설 풀이. 월·수요일 오답 반드시 포함."],["자료구조","객관식 20 + 주관식 8","보기 순서·숫자·큐 상태를 바꿔 풀기."],["동역학","취약 문제 6개","시작할 때 힘·에너지·충격량 중 무엇을 쓸지 먼저 적기."],["차량소프트웨어","질문 10개 답안 재현","정의·비교·이유·예시까지 확인."]]],
["2026-10-16","질문할 내용 남기기",[["동역학","핵심 8문제 무해설 풀이","유형을 섞고 풀이 시간 기록."],["전자회로","핵심 6문제 · CH1 3 + BJT 3","미해결 부분은 ‘내 식·막힌 단계·질문’으로 정리. 수업이나 질문 기회 전에 가져가기."],["자료구조","객관식 15 + 주관식 5","이번 주 반복해서 틀린 조건 우선."],["차량소프트웨어","미회상 질문 10개 재시험","빠진 시험범위가 있으면 이날까지 우선 보완."]]],
["2026-10-17","실전 방식으로 전환",[["동역학","혼합 8문제 · 시간 제한","풀이 → 채점 → 오답 원인 기록."],["전자회로","혼합 6문제","레포트 오답과 비슷한 변형 문제 포함."],["자료구조","객관식 20 + 주관식 8","객관식과 주관식을 섞어서 풀기."],["차량소프트웨어","족보·예상 질문 15개","자료 없이 답안 작성."]]],
["2026-10-18","첫 시험 과목 집중",[["확률과 통계","CH1~3 혼합 8문제","CH3 최소 4개. 표준화·변환 등 막혔던 유형 재확인."],["차량소프트웨어","질문 15개 재시험","전날 빠뜨린 핵심 표현 우선 확인."],["동역학","토요일 오답 최대 5개","오답이 적으면 약한 유형으로 보충."],["자료구조","틀린 주관식 5개","답 없이 다시 작성."]]],
["2026-10-19","확통·차소웨 마감",[["확률과 통계","누적 오답 6개 무해설 풀이","공식 적용 조건 점검."],["차량소프트웨어","불안한 질문 10개","답안 재현 + 전체 범위 누락 확인."],["전자회로","취약 문제 4개","이미터 저항항·PNP 극성 등 반복 오류 확인."],["자료구조","오답 객관식 10 + 빈칸 5","기존 오답으로 감 유지."]]],
["2026-10-20","확통·차소웨 시험",[["확률과 통계","시험 · 일정 잠정","실제 시험 공지 확인."],["차량소프트웨어","시험","제공된 계획에서 20일로 명시된 일정."],["동역학","시험 후 취약 문제 4~6개","여력이 있을 때 진행."],["전자회로","기존 오답 짧게 확인","시험 후 여력에 맞춰 진행."],["자료구조","기존 오답 짧게 확인","시험 후 여력에 맞춰 진행."]]],
["2026-10-21","동역학 시험 · 일정 잠정",[["동역학","시험 · 일정 잠정","실제 시험 공지 확인."],["전자회로","핵심 4~6개","동역학 시험 후 진행."],["자료구조","객관식 20 + 주관식 5","동역학 시험 후 진행."]]],
["2026-10-22","전자·자구알 시험 · 일정 잠정",[["전자회로","시험 전 오답·실수 목록","새 문제보다 기존 오답만 점검. 시험일은 실제 공지 확인."],["자료구조","시험 전 오답·실수 목록","새 문제보다 기존 오답만 점검. 시험일은 실제 공지 확인."]]]
]
;
const colors={'동역학':'#8ec9b0','전자회로':'#e4c185','확률과통계':'#95bdf0','확통':'#95bdf0','자료구조':'#c6a7eb','자구알':'#c6a7eb','차량소프트웨어':'#e9a99b','차소웨':'#e9a99b','할일':'#bcbcc6'};
function subjectColor(name){const n=name.normalize('NFC').trim().replace(/\s+/g,'').toLowerCase();if(colors[n])return colors[n];let hash=0;for(const c of n)hash=(Math.imul(hash,31)+c.codePointAt(0))>>>0;return `hsl(${hash%360} 52% 74%)`;}

let state=window.savedState||{};state.status ||= {};state.notes ||= {};state.extra ||= {};let selected=state.selected||'2026-10-12',expanded=state.expanded??true,compact=window.nativePrefs?.compact||false,pinned=window.nativePrefs?.pin||false,desktop=window.nativePrefs?.desktop||false;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>new Date(s+'T12:00:00'),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,shift=(s,n)=>{let d=dt(s);d.setDate(d.getDate()+n);return key(d)},mon=s=>shift(s,-((dt(s).getDay()+6)%7));let start=mon(selected);
function native(action,data={}){window.webkit?.messageHandlers.native.postMessage({action,...data})}function save(){state.selected=selected;state.expanded=expanded;native('save',{state});if(!window.webkit)localStorage.setItem('studyglass-preview',JSON.stringify(state))}function showError(s){$('error').textContent=s}
function tasks(date){let p=PLAN.find(p=>p[0]===date);return [...(p?p[2].map((t,i)=>({id:date+'-'+i,subject:t[0],title:t[1],detail:t[2]})):[]),...(state.extra[date]||[])]}
function render(){let end=shift(start,6);$('range').textContent=`${dt(start).getMonth()+1}.${dt(start).getDate()} – ${dt(end).getMonth()+1}.${dt(end).getDate()}`;$('dayview').className=!expanded?'selected':'';$('weekview').className=expanded?'selected':'';
$('week').innerHTML=Array.from({length:7},(_,i)=>{let date=shift(start,i),ts=tasks(date),done=ts.filter(t=>state.status[t.id]===2).length;return `<button class="day ${date===selected?'chosen':''}" data-date="${date}" aria-label="${date} ${ts.length}개 할 일" aria-pressed="${date===selected}"><span class="dow">${['월','화','수','목','금','토','일'][i]}</span>${date===key(new Date())?'<i class="todaymark"></i>':''}<span class="date">${dt(date).getDate()}</span><span class="count">${ts.length?done+' / '+ts.length+' 통과':'계획 없음'}</span><div class="dot"><i style="width:${ts.length?100*done/ts.length:0}%"></i></div>${expanded?`<div class="weeklist">${ts.map(t=>`<div class="mini ${state.status[t.id]===2?'done':''}" style="--c:${subjectColor(t.subject)}"><strong>${esc(t.subject)}</strong>${esc(t.title)}</div>`).join('')}</div>`:''}</button>`}).join('');
let ts=tasks(selected),done=ts.filter(t=>state.status[t.id]===2).length;$('daytitle').textContent=`${dt(selected).getMonth()+1}월 ${dt(selected).getDate()}일 ${['일','월','화','수','목','금','토'][dt(selected).getDay()]}요일`;$('progress').textContent=`${done} / ${ts.length} 통과`;
$('tasks').innerHTML=ts.length?ts.map(t=>{let s=state.status[t.id]||0;return `<div class="task ${s===2?'passed':''}" style="--c:${subjectColor(t.subject)}"><button class="check s${s}" data-check="${t.id}" aria-label="${esc(t.title)}: ${['미시작','학습','통과'][s]}, 다음 상태로 변경">${['','◐','✓'][s]}</button><div class="taskbody"><div class="subject">${esc(t.subject)}</div><div class="tasktitle">${esc(t.title)}</div>${t.detail?`<details class="taskdetail"><summary>세부 내용</summary><div class="detail">${esc(t.detail)}</div></details>`:''}</div><span class="status">${['미시작','학습','통과'][s]}</span>${t.custom?`<button class="delete" data-delete="${t.id}" aria-label="추가한 할 일 삭제">×</button>`:''}</div>`}).join(''):'<div class="empty">등록된 목표 없음</div>';}
$('week').onclick=e=>{let b=e.target.closest('[data-date]');if(b){selected=b.dataset.date;expanded=false;save();render()}};$('tasks').onclick=e=>{let b=e.target.closest('[data-check]');if(b){let id=b.dataset.check;state.status[id]=((state.status[id]||0)+1)%3;save();render()}let d=e.target.closest('[data-delete]');if(d){state.extra[selected]=state.extra[selected].filter(t=>t.id!==d.dataset.delete);delete state.status[d.dataset.delete];save();render()}};
$('prev').onclick=()=>{start=shift(start,-7);selected=shift(selected,-7);save();render()};$('next').onclick=()=>{start=shift(start,7);selected=shift(selected,7);save();render()};$('today').onclick=()=>{selected=key(new Date());start=mon(selected);save();render()};$('dayview').onclick=()=>{expanded=false;save();render()};$('weekview').onclick=()=>{expanded=true;save();render()};$('addform').onsubmit=e=>{e.preventDefault();let title=$('newtask').value.trim();if(!title)return;(state.extra[selected]||=[]).push({id:'custom-'+crypto.randomUUID(),subject:$('newsubject').value.trim()||'할 일',title,detail:'',custom:true});$('newtask').value='';save();render()};
$('compact').onclick=()=>{compact=!compact;$('compact').textContent=compact?'펼치기':'작게';native('compact',{value:compact})};$('pin').onclick=()=>{pinned=!pinned;desktop=false;$('pin').classList.toggle('active',pinned);$('desktop').classList.remove('active');native('desktop',{value:false});native('pin',{value:pinned})};$('desktop').onclick=()=>{desktop=!desktop;pinned=false;$('desktop').classList.toggle('active',desktop);$('pin').classList.remove('active');native('desktop',{value:desktop})};$('compact').textContent=compact?'펼치기':'작게';$('desktop').classList.toggle('active',desktop);$('pin').classList.toggle('active',pinned);new ResizeObserver(()=>document.body.classList.toggle('compact',innerWidth<720)).observe(document.body);render();
</script></html>
