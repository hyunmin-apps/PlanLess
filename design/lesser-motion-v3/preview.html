<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>레서 · 모션</title><style>
*{box-sizing:border-box}body{margin:0;background:#111215;color:#e7e9ec;font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:40px;max-width:1000px;margin:auto}h1{font-size:24px;margin:0 0 24px}button{background:#25272d;border:1px solid #393c43;border-radius:10px;color:#aaa;padding:11px 18px;margin:0 6px 8px 0;cursor:pointer}button[aria-pressed=true]{color:#fff;background:#3b4a48;border-color:#82b5a5}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:24px}.card{background:#191b20;border:1px solid #2b2e35;border-radius:24px;padding:24px;text-align:center}.stage{height:300px;display:grid;place-items:center}.stage img{width:256px;height:256px;image-rendering:pixelated}h2{font-size:17px}p{color:#9da3af;line-height:1.7}.controls{margin-top:24px}input{accent-color:#8cc5ad;width:220px}small{color:#777f8b}@media(max-width:650px){body{padding:24px}.cards{grid-template-columns:1fr}}
</style><h1>계획단장 레서 · 열정 레서</h1><nav id="states"></nav><div class="cards"><section class="card"><h2>계획단장 레서</h2><div class="stage"><img id="planner" alt="계획단장 레서 애니메이션"></div><p id="plannerNote"></p></section><section class="card"><h2>열정 레서</h2><div class="stage"><img id="passion" alt="열정 레서 애니메이션"></div><p id="passionNote"></p></section></div><div class="controls"><button id="play">일시 정지</button><input id="frame" type="range" min="0" max="7" value="0"><small id="counter"></small></div><p><small>64 × 64px · 상태별 8포즈 · 픽셀 원본 4배 확대</small></p><script>
const names=['idle','working','complete'],labels=['아무것도 안 하는 중','진행 중','완료'];const durations=[[500,200,200,100,200,200,200,400],[300,200,100,200,300,200,200,300],[300,200,100,200,300,100,200,500]];
const notes=[['호흡 · 눈 깜빡임','쉬어가기 · 꼬리 움직임'],['파란 눈빛 · 계획 체크','불꽃 · 응원'],['체크 · 머리 위 회전','불꽃 OFF · 폭죽 · 점프']];let state=0,index=0,playing=true,timer;
const buttons=names.map((n,i)=>{const b=document.createElement('button');b.textContent=labels[i];b.onclick=()=>{state=i;index=0;render();schedule()};states.append(b);return b});
function render(){['planner','passion'].forEach((n,i)=>{document.getElementById(n).src=n+'/frame-'+String(state*8+index+1).padStart(2,'0')+'.png';document.getElementById(n+'Note').textContent=notes[state][i]});buttons.forEach((b,i)=>b.setAttribute('aria-pressed',i===state));frame.value=index;counter.textContent=` ${index+1} / 8`;play.textContent=playing?'일시 정지':'재생'}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{index=(index+1)%8;render();schedule()},durations[state][index])}play.onclick=()=>{playing=!playing;render();schedule()};frame.oninput=()=>{playing=false;index=+frame.value;render();schedule()};render();schedule();
</script></html>
